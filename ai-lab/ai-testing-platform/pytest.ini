[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

markers =
    generation: Test case generation module tests
    prediction: Defect prediction module tests
    script_gen: Script generation module tests
    llm: LLMEvaluator tests (requires OPENAI_API_KEY, excluded in CI)
    llm_quality: Quality evaluation tests (G-Eval, relevancy)
    llm_hallucination: Hallucination detection tests
    llm_security: Security red-team tests
    llm_bias: Bias detection tests
    P0: Critical priority tests
    P1: High priority tests
    P2: Medium priority tests
    smoke: Quick smoke tests
    scanner: CodeScanner unit tests
    rag: RAG full-pipeline tests
    rag_parse: Document parsing stage tests
    rag_chunk: Chunking stage tests
    rag_index: Vector indexing stage tests
    rag_retrieve: Retrieval stage tests
    rag_rerank: Reranking stage tests
    rag_context: Context building stage tests
    rag_answer: Answer generation stage tests
    rag_pipeline: End-to-end pipeline tests
    vision: Vision image classification tests
    vision_accuracy: Classification accuracy tests
    vision_threshold: Confidence threshold tests
    vision_robustness: Robustness tests
    vision_batch: Batch consistency tests
    knowledge_graph: Knowledge graph tests
    kg_accuracy: KG accuracy tests
    kg_completeness: KG completeness tests
    kg_consistency: KG consistency tests
    kg_timeliness: KG timeliness tests
    integration: Integration tests (requires external services)
