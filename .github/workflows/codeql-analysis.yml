name: CodeQL Analysis

# REQ-CICD-01: 代码语义级漏洞扫描
# 与 security-scan.yml (Trivy/npm audit) 互补：
# - Trivy: 依赖漏洞 + 容器扫描
# - CodeQL: 代码语义分析（XSS、SQL 注入、路径遍历等）

on:
  push:
    branches: [main]
    # paths + paths-ignore cannot be combined on one event (PDEF-022); negate instead
    paths:
      - '**/*.js'
      - '**/*.py'
      - '.github/workflows/codeql-analysis.yml'
      - '!**/node_modules/**'
      - '!**/venv/**'
      - '!**/*.min.js'
  pull_request:
    branches: [main]
    # paths + paths-ignore cannot be combined on one event (PDEF-022); negate instead
    paths:
      - '**/*.js'
      - '**/*.py'
      - '.github/workflows/codeql-analysis.yml'
      - '!**/node_modules/**'
      - '!**/venv/**'
      - '!**/*.min.js'
  schedule:
    # 每周一 04:00 UTC 定期扫描，检测新披露的漏洞模式
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level: `matrix` is not available in workflow-level concurrency (PDEF-022)
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pip (Python analysis)
        if: matrix.language == 'python'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: codeql-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: codeql-pip-

      - name: Cache npm (JavaScript analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: codeql-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: codeql-npm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
