name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projects/functional/api-testing-demo/package-lock.json
            cicd-demo/package-lock.json
            projects/functional/iwsva-cypress-e2e/package-lock.json
            projects/platform/microservice-testing-platform/package-lock.json
            projects/platform/performance-testing-platform/package-lock.json
            projects/functional/playwright-demo/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            projects/ai/ai-testing-platform/pyproject.toml
            projects/ai/ai-testing-platform/requirements.txt
            projects/platform/k8s-auto-testing-platform/app/requirements.txt
            projects/platform/k8s-auto-testing-platform/pyproject.toml
            projects/platform/k8s-auto-testing-platform/requirements.txt
            projects/security/security-testing-demo/pyproject.toml
            projects/security/security-testing-demo/requirements.txt
            projects/functional/selenium-demo/pyproject.toml
            projects/functional/selenium-demo/requirements.txt
            projects/platform/sid-iam-testing-platform/pyproject.toml
            projects/platform/sid-iam-testing-platform/requirements.txt

      - name: Show warmed dependency manifests
        shell: bash
        run: |
          echo "Node lockfiles cached:"
          find . -name package-lock.json | sort
          echo
          echo "Python dependency manifests cached:"
          find . \( -name requirements.txt -o -name pyproject.toml \) | sort
