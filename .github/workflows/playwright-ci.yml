name: Playwright Demo CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/functional/playwright-demo/**'
      - '.github/workflows/playwright-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/functional/playwright-demo/**'
      - '.github/workflows/playwright-ci.yml'

concurrency:
  group: playwright-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/functional/playwright-demo

jobs:
  e2e-tests:
    name: Playwright / E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: '22'
          working-directory: projects/functional/playwright-demo
          cache-dependency-path: projects/functional/playwright-demo/package-lock.json
      - name: Type check
        run: npx tsc --noEmit -p .
      # Chromium only: linux visual baselines exist for chromium; other engines can be added later
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            projects/functional/playwright-demo/playwright-report/
            projects/functional/playwright-demo/test-results/
          retention-days: 7
