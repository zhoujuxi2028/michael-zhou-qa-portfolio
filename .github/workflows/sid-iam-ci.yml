name: SID IAM CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/sid-iam-testing]
    paths: &sid_iam_trigger_paths
      - '.github/workflows/sid-iam-ci.yml'
      - '.github/actions/setup-python-project/**'
      - 'projects/platform/sid-iam-testing-platform/src/**'
      - 'projects/platform/sid-iam-testing-platform/tests/**'
      - 'projects/platform/sid-iam-testing-platform/scripts/**'
      - 'projects/platform/sid-iam-testing-platform/requirements.txt'
      - 'projects/platform/sid-iam-testing-platform/pytest.ini'
      - 'projects/platform/sid-iam-testing-platform/pyproject.toml'
  pull_request:
    branches: [main]
    paths: *sid_iam_trigger_paths

concurrency:
  group: sid-iam-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/platform/sid-iam-testing-platform

jobs:
  code-quality:
    name: SID IAM / Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-project
        with:
          working-directory: projects/platform/sid-iam-testing-platform
          cache-dependency-path: projects/platform/sid-iam-testing-platform/requirements.txt
      - run: black --check src/ tests/
      - run: isort --check-only src/ tests/
      - run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203

  unit-tests:
    name: SID IAM / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: code-quality
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-project
        with:
          working-directory: projects/platform/sid-iam-testing-platform
          cache-dependency-path: projects/platform/sid-iam-testing-platform/requirements.txt
      - name: Run unit tests (exclude integration)
        run: pytest tests/ -v -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: projects/platform/sid-iam-testing-platform/coverage.xml

  integration-tests:
    name: SID IAM / Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-project
        with:
          working-directory: projects/platform/sid-iam-testing-platform
          cache-dependency-path: projects/platform/sid-iam-testing-platform/requirements.txt
      - name: Run integration tests
        run: pytest tests/ -v -m integration

  verify-priority:
    name: SID IAM / Priority Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-project
        with:
          working-directory: projects/platform/sid-iam-testing-platform
          cache-dependency-path: projects/platform/sid-iam-testing-platform/requirements.txt
      - name: Verify P0 and security markers
        run: |
          echo "=== P0 Critical (60 tests) ==="
          pytest tests/ -v -m P0 --tb=no -q
          echo "=== Security tests ==="
          pytest tests/ -v -m security --tb=no -q
