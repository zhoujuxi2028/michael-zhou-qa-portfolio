name: AV Testing Demo CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/multimedia/av-testing-demo/**'
      - '.github/workflows/av-testing-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/multimedia/av-testing-demo/**'
      - '.github/workflows/av-testing-ci.yml'

concurrency:
  group: av-testing-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/multimedia/av-testing-demo

jobs:
  unit-tests:
    name: AV Testing / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/multimedia/av-testing-demo/requirements.txt
      # ffmpeg binary is bundled by imageio-ffmpeg; no system package needed
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
