name: SQL Testing Demo CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/*", "chore/*", "test/*"]
    paths: ["projects/database/sql-testing-demo/**"]
  pull_request:
    branches: [main]
    paths: ["projects/database/sql-testing-demo/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/database/sql-testing-demo

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: projects/database/sql-testing-demo/.python-version
          cache: pip
          cache-dependency-path: projects/database/sql-testing-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff format --check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fastware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_EXTERNAL_DB: "true"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fastware
      DB_USER: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: projects/database/sql-testing-demo/.python-version
          cache: pip
          cache-dependency-path: projects/database/sql-testing-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: >-
          pytest tests/unit/ -v
          -m "crud or queries or constraints or procedures"

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fastware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_EXTERNAL_DB: "true"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fastware
      DB_USER: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: projects/database/sql-testing-demo/.python-version
          cache: pip
          cache-dependency-path: projects/database/sql-testing-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: >-
          pytest tests/integration/ -v
          -m "transactions or performance or reports"
