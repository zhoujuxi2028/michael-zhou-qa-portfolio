version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "enhancement"
    commit-message:
      prefix: "chore(actions)"
    groups:
      routine-updates:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # npm — root
  - package-ecosystem: "npm"
